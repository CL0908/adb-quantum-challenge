" fill="#1E2430" font-weight="400" text-anchor="start" font-family="'Source Serif 4', 'STIX Two Math', Georgia, serif"><tspan>A|0⟩ = Σ</tspan><tspan baseline-shift="sub" font-size="10.9">x</tspan><tspan> √q</tspan><tspan baseline-shift="sub" font-size="10.9">η</tspan><tspan>(x) |x⟩ ( √(1 − g(x)) |0⟩ + √g(x) |1⟩ ),   </tspan><tspan>g(x) = 1{L &gt; T} e</tspan><tspan baseline-shift="super" font-size="10.9">−η(U − T)</tspan><tspan>,   </tspan><tspan>a = Σ</tspan><tspan baseline-shift="sub" font-size="10.9">x</tspan><tspan> q</tspan><tspan baseline-shift="sub" font-size="10.9">η</tspan><tspan>(x) g(x) = μ e</tspan><tspan baseline-shift="super" font-size="10.9">ηT − Λ(η)</tspan></text><text x="50" y="820" font-size="12" fill="#4F5563" font-weight="400" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Every register and gate count grows linearly in n and |E|; loading is exact (no truncation, no trained quantum model); the weight needs one controlled rotation per bit of D.</text></svg>