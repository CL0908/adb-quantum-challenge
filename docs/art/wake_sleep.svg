<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 760" width="1340" height="760" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><rect width="1340" height="760" fill="#FBFAF7"/><text x="30" y="34" font-size="12.5" fill="#B8893B" font-weight="700" text-anchor="start">EXHIBIT 2</text><text x="30" y="62" font-size="21" fill="#0B2341" font-weight="700" text-anchor="start">Wake–sleep operating cycle: serve by day, consolidate and self-improve by night</text><line x1="30" y1="76" x2="1310" y2="76" stroke="#0B2341" stroke-width="2"/><text x="30" y="98" font-size="13" fill="#6B7280" font-weight="400" text-anchor="start">Adapted from the wake–sleep framework for continual learning (Behrouz et al., 2026); what is consolidated here is the risk model, not the language model.</text><rect x="30" y="170" width="520" height="450" rx="4" fill="#E6EDF5" stroke="#5B7FA6" stroke-width="1.3"/><text x="48" y="200" font-size="13" fill="#B8893B" font-weight="700" text-anchor="start">WAKE PHASE</text><text x="48" y="224" font-size="16" fill="#0B2341" font-weight="700" text-anchor="start">Serving the day: frozen, validated policies</text><rect x="48" y="250" width="200" height="50" rx="3" fill="#FBFAF7" stroke="#5B7FA6" stroke-width="1.3"/><text x="60" y="272.0" font-size="13" fill="#0B2341" font-weight="600" text-anchor="start">Daily news &amp; reports</text><text x="60" y="289.0" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">news-scout agent</text><polyline points="248,275 298,275" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="298,275 291.7,278.0 291.7,272.0" fill="#1F3A5F"/><rect x="48" y="312" width="200" height="50" rx="3" fill="#FBFAF7" stroke="#5B7FA6" stroke-width="1.3"/><text x="60" y="334.0" font-size="13" fill="#0B2341" font-weight="600" text-anchor="start">Hazard &amp; forecast feeds</text><text x="60" y="351.0" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">data agent</text><polyline points="248,337 298,337" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="298,337 291.7,340.0 291.7,334.0" fill="#1F3A5F"/><rect x="48" y="374" width="200" height="50" rx="3" fill="#FBFAF7" stroke="#5B7FA6" stroke-width="1.3"/><text x="60" y="396.0" font-size="13" fill="#0B2341" font-weight="600" text-anchor="start">Analyst questions</text><text x="60" y="413.0" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">advisory agent</text><polyline points="248,399 298,399" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="298,399 291.7,402.0 291.7,396.0" fill="#1F3A5F"/><rect x="298" y="250" width="232" height="174" rx="3" fill="#0B2341" stroke="#0B2341" stroke-width="1.3"/><text x="310" y="342.0" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="start"></text><text x="312" y="276" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">RDPO serving</text><text x="314" y="300" font-size="12" fill="#A9BED6" font-weight="400" text-anchor="start">· today's policy library θ_t</text><text x="314" y="321" font-size="12" fill="#A9BED6" font-weight="400" text-anchor="start">· estimates ± CI on demand</text><text x="314" y="342" font-size="12" fill="#A9BED6" font-weight="400" text-anchor="start">· same-day event impact</text><text x="314" y="363" font-size="12" fill="#A9BED6" font-weight="400" text-anchor="start">· exact checks where possible</text><text x="314" y="384" font-size="12" fill="#A9BED6" font-weight="400" text-anchor="start">· unbiased for any θ</text><text x="48" y="470" font-size="11" fill="#B8893B" font-weight="700" text-anchor="start">SHORT-TERM MEMORY (written all day)</text><rect x="48" y="482" width="152" height="56" rx="3" fill="#FBFAF7" stroke="#5B7FA6" stroke-width="1.3"/><text x="60" y="507.0" font-size="13" fill="#0B2341" font-weight="600" text-anchor="start">Event log</text><text x="60" y="524.0" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">new events, credibility</text><rect x="214" y="482" width="152" height="56" rx="3" fill="#FBFAF7" stroke="#5B7FA6" stroke-width="1.3"/><text x="226" y="507.0" font-size="13" fill="#0B2341" font-weight="600" text-anchor="start">Query log</text><text x="226" y="524.0" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">targets &amp; scenarios asked</text><rect x="380" y="482" width="152" height="56" rx="3" fill="#FBFAF7" stroke="#5B7FA6" stroke-width="1.3"/><text x="392" y="507.0" font-size="13" fill="#0B2341" font-weight="600" text-anchor="start">Path buffer</text><text x="392" y="524.0" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">sampled paths + weights</text><polyline points="414,424 414,482" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linejoin="round"/><polygon points="414,482 411.0,475.7 417.0,475.7" fill="#1F3A5F"/><text x="48" y="580" font-size="12" fill="#1E2430" font-weight="400" text-anchor="start">Nothing in the risk model changes during the day: every number</text><text x="48" y="598" font-size="12" fill="#1E2430" font-weight="400" text-anchor="start">served is reproducible from a versioned policy and source model.</text><rect x="600" y="170" width="710" height="450" rx="4" fill="#0B2341"/><text x="618" y="200" font-size="13" fill="#B8893B" font-weight="700" text-anchor="start">SLEEP PHASE</text><text x="618" y="224" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start">Overnight: consolidate, dream, then gate</text><rect x="618.0" y="250" width="214.0" height="180" rx="3" fill="#1F3A5F" stroke="#5B7FA6" stroke-width="1"/><text x="630.0" y="276" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">1  Consolidation</text><text x="630.0" y="304" font-size="11.2" fill="#A9BED6" font-weight="400" text-anchor="start">event log → credibility-weighted</text><text x="630.0" y="326" font-size="11.2" fill="#A9BED6" font-weight="400" text-anchor="start">rate updates (analyst-approved)</text><text x="630.0" y="348" font-size="11.2" fill="#A9BED6" font-weight="400" text-anchor="start">new shared events → graph edges</text><text x="630.0" y="370" font-size="11.2" fill="#A9BED6" font-weight="400" text-anchor="start">path buffer → warm start θ</text><polyline points="832.0,340 848.0,340" fill="none" stroke="#B8893B" stroke-width="1.8" stroke-linejoin="round"/><polygon points="848.0,340 841.7,343.0 841.7,337.0" fill="#B8893B"/><rect x="848.0" y="250" width="214.0" height="180" rx="3" fill="#1F3A5F" stroke="#5B7FA6" stroke-width="1"/><text x="860.0" y="276" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">2  Dreaming</text><text x="860.0" y="304" font-size="11.2" fill="#A9BED6" font-weight="400" text-anchor="start">synthetic stress scenarios where</text><text x="860.0" y="326" font-size="11.2" fill="#A9BED6" font-weight="400" text-anchor="start">today's χ² was highest (RL curriculum)</text><text x="860.0" y="348" font-size="11.2" fill="#A9BED6" font-weight="400" text-anchor="start">retrain KL → χ² from θ_t</text><text x="860.0" y="370" font-size="11.2" fill="#A9BED6" font-weight="400" text-anchor="start">grow features only if χ² stalls</text><polyline points="1062.0,340 1078.0,340" fill="none" stroke="#B8893B" stroke-width="1.8" stroke-linejoin="round"/><polygon points="1078.0,340 1071.7,343.0 1071.7,337.0" fill="#B8893B"/><rect x="1078.0" y="250" width="214.0" height="180" rx="3" fill="#1F3A5F" stroke="#5B7FA6" stroke-width="1"/><text x="1090.0" y="276" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">3  Gate (no forgetting)</text><text x="1090.0" y="304" font-size="11.2" fill="#A9BED6" font-weight="400" text-anchor="start">regression: 25 exact ADB values,</text><text x="1090.0" y="326" font-size="11.2" fill="#A9BED6" font-weight="400" text-anchor="start">tensor-network references,</text><text x="1090.0" y="348" font-size="11.2" fill="#A9BED6" font-weight="400" text-anchor="start">coverage on fresh replications</text><text x="1090.0" y="370" font-size="11.2" fill="#A9BED6" font-weight="400" text-anchor="start">promote θ_t+1 or roll back</text><rect x="618" y="450" width="674" height="56" rx="3" fill="#F1E4CB"/><text x="634" y="474" font-size="13" fill="#0B2341" font-weight="700" text-anchor="start">Long-term memory (versioned)</text><text x="634" y="494" font-size="12" fill="#1F3A5F" font-weight="400" text-anchor="start">source laws p_k · dependence graph · policy library θ per target and scenario · validation record</text><text x="618" y="550" font-size="12" fill="#A9BED6" font-weight="400" text-anchor="start">Why this is safe: the estimator stays unbiased whatever θ is learned, so a weaker</text><text x="618" y="570" font-size="12" fill="#A9BED6" font-weight="400" text-anchor="start">overnight policy can only widen intervals; the gate rejects it before morning.</text><polyline points="490,164 490,148 660,148 660,164" fill="none" stroke="#B8893B" stroke-width="2" stroke-linejoin="round"/><polygon points="660,164 657.0,157.7 663.0,157.7" fill="#B8893B"/><text x="575.0" y="142" font-size="12" fill="#B8893B" font-weight="600" text-anchor="middle">night: short-term memory handed over</text><polyline points="660,626 660,644 490,644 490,626" fill="none" stroke="#B8893B" stroke-width="2" stroke-linejoin="round"/><polygon points="490,626 493.0,632.3 487.0,632.3" fill="#B8893B"/><text x="575.0" y="662" font-size="12" fill="#B8893B" font-weight="600" text-anchor="middle">morning: promoted policies θ_t+1 + updated model + morning brief</text><line x1="30" y1="726" x2="1310" y2="726" stroke="#C9CED6" stroke-width="1"/><text x="30" y="746" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">Planned for WP3 (overnight retraining, capacity growth) and WP5 (agents). Phase 1 already provides the gate's exact references and the warm-start mechanism.</text></svg>