<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><line x1="32.0" y1="90.0" x2="64.0" y2="90.0" stroke="#C8553A" stroke-width="2"/><line x1="64.0" y1="90.0" x2="96.0" y2="90.0" stroke="#C8553A" stroke-width="2"/><line x1="96.0" y1="90.0" x2="128.0" y2="90.0" stroke="#C8553A" stroke-width="2"/><line x1="128.0" y1="90.0" x2="160.0" y2="90.0" stroke="#C8553A" stroke-width="2"/><line x1="160.0" y1="90.0" x2="192.0" y2="90.0" stroke="#C8553A" stroke-width="2"/><circle cx="32.0" cy="90.0" r="9" fill="#1F3557"/><circle cx="64.0" cy="90.0" r="9" fill="#1F3557"/><circle cx="96.0" cy="90.0" r="9" fill="#1F3557"/><circle cx="128.0" cy="90.0" r="9" fill="#1F3557"/><circle cx="160.0" cy="90.0" r="9" fill="#1F3557"/><circle cx="192.0" cy="90.0" r="9" fill="#1F3557"/><text x="112" y="175" font-size="14" fill="#1F3557" font-weight="700" text-anchor="middle">Chain</text><text x="112" y="195" font-size="10" fill="#4F5563" font-weight="400" text-anchor="middle">each country shares a fault zone</text><text x="112" y="209" font-size="10" fill="#4F5563" font-weight="400" text-anchor="middle">with its two neighbours (e.g. a</text><text x="112" y="223" font-size="10" fill="#4F5563" font-weight="400" text-anchor="middle">mountain belt)</text><line x1="337.0" y1="38.0" x2="382.0" y2="64.0" stroke="#C8553A" stroke-width="2"/><line x1="382.0" y1="64.0" x2="382.0" y2="116.0" stroke="#C8553A" stroke-width="2"/><line x1="382.0" y1="116.0" x2="337.0" y2="142.0" stroke="#C8553A" stroke-width="2"/><line x1="337.0" y1="142.0" x2="292.0" y2="116.0" stroke="#C8553A" stroke-width="2"/><line x1="292.0" y1="116.0" x2="292.0" y2="64.0" stroke="#C8553A" stroke-width="2"/><line x1="292.0" y1="64.0" x2="337.0" y2="38.0" stroke="#C8553A" stroke-width="2"/><circle cx="337.0" cy="38.0" r="9" fill="#1F3557"/><circle cx="382.0" cy="64.0" r="9" fill="#1F3557"/><circle cx="382.0" cy="116.0" r="9" fill="#1F3557"/><circle cx="337.0" cy="142.0" r="9" fill="#1F3557"/><circle cx="292.0" cy="116.0" r="9" fill="#1F3557"/><circle cx="292.0" cy="64.0" r="9" fill="#1F3557"/><text x="337" y="175" font-size="14" fill="#1F3557" font-weight="700" text-anchor="middle">Ring</text><text x="337" y="195" font-size="10" fill="#4F5563" font-weight="400" text-anchor="middle">a closed chain: the first and last</text><text x="337" y="209" font-size="10" fill="#4F5563" font-weight="400" text-anchor="middle">countries are also linked</text><line x1="562.0" y1="90.0" x2="562.0" y2="38.0" stroke="#C8553A" stroke-width="2"/><line x1="562.0" y1="90.0" x2="607.0" y2="64.0" stroke="#C8553A" stroke-width="2"/><line x1="562.0" y1="90.0" x2="607.0" y2="116.0" stroke="#C8553A" stroke-width="2"/><line x1="562.0" y1="90.0" x2="562.0" y2="142.0" stroke="#C8553A" stroke-width="2"/><line x1="562.0" y1="90.0" x2="517.0" y2="116.0" stroke="#C8553A" stroke-width="2"/><circle cx="562.0" cy="90.0" r="9" fill="#1F3557"/><circle cx="562.0" cy="38.0" r="9" fill="#1F3557"/><circle cx="607.0" cy="64.0" r="9" fill="#1F3557"/><circle cx="607.0" cy="116.0" r="9" fill="#1F3557"/><circle cx="562.0" cy="142.0" r="9" fill="#1F3557"/><circle cx="517.0" cy="116.0" r="9" fill="#1F3557"/><text x="562" y="175" font-size="14" fill="#1F3557" font-weight="700" text-anchor="middle">Star</text><text x="562" y="195" font-size="10" fill="#4F5563" font-weight="400" text-anchor="middle">one hub country (shared basin /</text><text x="562" y="209" font-size="10" fill="#4F5563" font-weight="400" text-anchor="middle">river) linked to all others</text><line x1="787.0" y1="38.0" x2="832.0" y2="64.0" stroke="#C8553A" stroke-width="2"/><line x1="787.0" y1="38.0" x2="832.0" y2="116.0" stroke="#C8553A" stroke-width="2"/><line x1="787.0" y1="38.0" x2="787.0" y2="142.0" stroke="#C8553A" stroke-width="2"/><line x1="787.0" y1="38.0" x2="742.0" y2="116.0" stroke="#C8553A" stroke-width="2"/><line x1="787.0" y1="38.0" x2="742.0" y2="64.0" stroke="#C8553A" stroke-width="2"/><line x1="832.0" y1="64.0" x2="832.0" y2="116.0" stroke="#C8553A" stroke-width="2"/><line x1="832.0" y1="64.0" x2="787.0" y2="142.0" stroke="#C8553A" stroke-width="2"/><line x1="832.0" y1="64.0" x2="742.0" y2="116.0" stroke="#C8553A" stroke-width="2"/><line x1="832.0" y1="64.0" x2="742.0" y2="64.0" stroke="#C8553A" stroke-width="2"/><line x1="832.0" y1="116.0" x2="787.0" y2="142.0" stroke="#C8553A" stroke-width="2"/><line x1="832.0" y1="116.0" x2="742.0" y2="116.0" stroke="#C8553A" stroke-width="2"/><line x1="832.0" y1="116.0" x2="742.0" y2="64.0" stroke="#C8553A" stroke-width="2"/><line x1="787.0" y1="142.0" x2="742.0" y2="116.0" stroke="#C8553A" stroke-width="2"/><line x1="787.0" y1="142.0" x2="742.0" y2="64.0" stroke="#C8553A" stroke-width="2"/><line x1="742.0" y1="116.0" x2="742.0" y2="64.0" stroke="#C8553A" stroke-width="2"/><circle cx="787.0" cy="38.0" r="9" fill="#1F3557"/><circle cx="832.0" cy="64.0" r="9" fill="#1F3557"/><circle cx="832.0" cy="116.0" r="9" fill="#1F3557"/><circle cx="787.0" cy="142.0" r="9" fill="#1F3557"/><circle cx="742.0" cy="116.0" r="9" fill="#1F3557"/><circle cx="742.0" cy="64.0" r="9" fill="#1F3557"/><text x="787" y="175" font-size="14" fill="#1F3557" font-weight="700" text-anchor="middle">Complete</text><text x="787" y="195" font-size="10" fill="#4F5563" font-weight="400" text-anchor="middle">every pair of countries can be hit</text><text x="787" y="209" font-size="10" fill="#4F5563" font-weight="400" text-anchor="middle">by a common event</text><text x="450" y="20" font-size="11" fill="#4F5563" font-weight="400" text-anchor="middle">nodes = countries   ·   edges = shared-event sources (common shocks)</text></svg>