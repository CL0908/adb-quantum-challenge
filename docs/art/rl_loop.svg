<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><rect x="0" y="0" width="1180" height="470" rx="18" fill="#FAF6EE"/><text x="40" y="52" font-size="12" fill="#8A8E98" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', monospace">THE REINFORCEMENT-LEARNING VIEW</text><text x="40" y="92" font-size="34" fill="#C8553A" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', monospace">One loop.</text><text x="40" y="122" font-size="14" fill="#4F5563" font-weight="400" text-anchor="start">Sampling a catastrophe scenario is a sequence of K decisions;</text><text x="40" y="142" font-size="14" fill="#4F5563" font-weight="400" text-anchor="start">the zero-variance sampler is the optimal soft policy.</text><rect x="230" y="185" width="300" height="64" rx="8" fill="#F2E3DC" stroke="#C8553A" stroke-width="1.4"/><text x="380.0" y="213.22" font-size="14" fill="#1F3557" font-weight="600" text-anchor="middle">Policy  q_θ(x | s)</text><text x="380.0" y="230.72" font-size="11.5" fill="#4F5563" font-weight="400" text-anchor="middle">Boltzmann over p_k(x)·e^{θ·ΔΦ}</text><rect x="230" y="360" width="300" height="64" rx="8" fill="#DCE8F5" stroke="#24426A" stroke-width="1.4"/><text x="380.0" y="388.21999999999997" font-size="14" fill="#1F3557" font-weight="600" text-anchor="middle">Environment: source k</text><text x="380.0" y="405.71999999999997" font-size="11.5" fill="#4F5563" font-weight="400" text-anchor="middle">draw x ~ q, state s ⊕ x (capped)</text><polyline points="530,217 610,217 610,392 530,392" fill="none" stroke="#1E2430" stroke-width="1.8" stroke-linejoin="round"/><polygon points="530,392 536.3,389.0 536.3,395.0" fill="#1E2430"/><text x="620" y="300" font-size="12" fill="#4F5563" font-weight="400" text-anchor="start">action x_k</text><polyline points="230,392 150,392 150,217 230,217" fill="none" stroke="#1E2430" stroke-width="1.8" stroke-linejoin="round"/><polygon points="230,217 223.7,220.0 223.7,214.0" fill="#1E2430"/><text x="70" y="300" font-size="12" fill="#4F5563" font-weight="400" text-anchor="start">state s_{k+1}</text><text x="380" y="300" font-size="13" fill="#1F3557" font-weight="600" text-anchor="middle">k = 1 … K</text><text x="380" y="318" font-size="11.5" fill="#4F5563" font-weight="400" text-anchor="middle">then payoff f, weight w</text><line x1="670" y1="40" x2="670" y2="430" stroke="#DDD4C4" stroke-width="1"/><text x="700" y="52" font-size="12" fill="#8A8E98" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', monospace">MDP DEFINITION</text><rect x="700" y="70" width="430" height="34" rx="4" fill="#FFFFFF" stroke="#DDD4C4" stroke-width="0.8"/><text x="712" y="92" font-size="12.5" fill="#1F3557" font-weight="700" text-anchor="start">State</text><text x="820" y="92" font-size="12.5" fill="#1E2430" font-weight="400" text-anchor="start">capped levels (a_i, r_i) of all countries</text><rect x="700" y="112" width="430" height="34" rx="4" fill="#F6EFE3" stroke="#DDD4C4" stroke-width="0.8"/><text x="712" y="134" font-size="12.5" fill="#1F3557" font-weight="700" text-anchor="start">Action</text><text x="820" y="134" font-size="12.5" fill="#1E2430" font-weight="400" text-anchor="start">increment x of source k (≤ 25 values)</text><rect x="700" y="154" width="430" height="34" rx="4" fill="#FFFFFF" stroke="#DDD4C4" stroke-width="0.8"/><text x="712" y="176" font-size="12.5" fill="#1F3557" font-weight="700" text-anchor="start">Transition</text><text x="820" y="176" font-size="12.5" fill="#1E2430" font-weight="400" text-anchor="start">s ⊕ x  (deterministic, capped)</text><rect x="700" y="196" width="430" height="34" rx="4" fill="#F6EFE3" stroke="#DDD4C4" stroke-width="0.8"/><text x="712" y="218" font-size="12.5" fill="#1F3557" font-weight="700" text-anchor="start">Reference</text><text x="820" y="218" font-size="12.5" fill="#1E2430" font-weight="400" text-anchor="start">true source law p_k</text><rect x="700" y="238" width="430" height="34" rx="4" fill="#FFFFFF" stroke="#DDD4C4" stroke-width="0.8"/><text x="712" y="260" font-size="12.5" fill="#1F3557" font-weight="700" text-anchor="start">Reward</text><text x="820" y="260" font-size="12.5" fill="#1E2430" font-weight="400" text-anchor="start">log f(s_K) − KL(q ‖ p) per step</text><rect x="700" y="280" width="430" height="34" rx="4" fill="#F6EFE3" stroke="#DDD4C4" stroke-width="0.8"/><text x="712" y="302" font-size="12.5" fill="#1F3557" font-weight="700" text-anchor="start">Optimum</text><text x="820" y="302" font-size="12.5" fill="#1E2430" font-weight="400" text-anchor="start">Doob transform: w·f = μ on every path</text><rect x="700" y="322" width="430" height="34" rx="4" fill="#FFFFFF" stroke="#DDD4C4" stroke-width="0.8"/><text x="712" y="344" font-size="12.5" fill="#C8553A" font-weight="700" text-anchor="start">Learner 1</text><text x="820" y="344" font-size="12.5" fill="#1E2430" font-weight="400" text-anchor="start">cross-entropy: weighted MLE (KL)</text><rect x="700" y="364" width="430" height="34" rx="4" fill="#F6EFE3" stroke="#DDD4C4" stroke-width="0.8"/><text x="712" y="386" font-size="12.5" fill="#C8553A" font-weight="700" text-anchor="start">Learner 2</text><text x="820" y="386" font-size="12.5" fill="#1E2430" font-weight="400" text-anchor="start">REINFORCE on log E[(wf)²] (χ²)</text></svg>