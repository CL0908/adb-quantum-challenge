<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><text x="20" y="24" font-size="13" fill="#1F3557" font-weight="700" text-anchor="start">Future work: structured (Poisson-source) loading for amplitude estimation</text><text x="20" y="66" font-size="11" fill="#2F6AB0" font-weight="700" text-anchor="start">source 1  (3 qb)</text><line x1="170" y1="62" x2="880" y2="62" stroke="#DDD4C4" stroke-width="2"/><text x="20" y="110" font-size="11" fill="#C8553A" font-weight="700" text-anchor="start">source 2  (6 qb)</text><line x1="170" y1="106" x2="880" y2="106" stroke="#DDD4C4" stroke-width="2"/><text x="20" y="154" font-size="11" fill="#AD7A00" font-weight="700" text-anchor="start">source K  (1 qb)</text><line x1="170" y1="150" x2="880" y2="150" stroke="#DDD4C4" stroke-width="2"/><text x="20" y="198" font-size="11" fill="#1F3557" font-weight="700" text-anchor="start">country sums  Sᵢ, Rᵢ</text><line x1="170" y1="194" x2="880" y2="194" stroke="#DDD4C4" stroke-width="2"/><text x="20" y="242" font-size="11" fill="#00897B" font-weight="700" text-anchor="start">objective qubit</text><line x1="170" y1="238" x2="880" y2="238" stroke="#DDD4C4" stroke-width="2"/><rect x="190" y="47" width="120" height="30" rx="6" fill="#EFE6D3" stroke="#2F6AB0" stroke-width="1.2"/><text x="250" y="67" font-size="10" fill="#1E2430" font-weight="600" text-anchor="middle">prepare √q_k (tilted)</text><rect x="190" y="91" width="120" height="30" rx="6" fill="#EFE6D3" stroke="#C8553A" stroke-width="1.2"/><text x="250" y="111" font-size="10" fill="#1E2430" font-weight="600" text-anchor="middle">prepare √q_k (tilted)</text><rect x="190" y="135" width="120" height="30" rx="6" fill="#EFE6D3" stroke="#AD7A00" stroke-width="1.2"/><text x="250" y="155" font-size="10" fill="#1E2430" font-weight="600" text-anchor="middle">prepare √q_k (tilted)</text><rect x="340" y="47" width="170" height="160" rx="8" fill="#FBF8F1" stroke="#1F3557" stroke-width="1.2"/><text x="425" y="120" font-size="11" fill="#1F3557" font-weight="700" text-anchor="middle">in-place adders</text><text x="425" y="138" font-size="10" fill="#4F5563" font-weight="400" text-anchor="middle">Sᵢ += Δaᵢ ,  Rᵢ += Δrᵢ</text><rect x="540" y="47" width="200" height="208" rx="8" fill="#FBF8F1" stroke="#00897B" stroke-width="1.2"/><text x="640" y="150" font-size="11" fill="#00897B" font-weight="700" text-anchor="middle">payoff oracle</text><text x="640" y="168" font-size="10" fill="#4F5563" font-weight="400" text-anchor="middle">cap · L = Σ 7aᵢ + 4rᵢ</text><text x="640" y="186" font-size="10" fill="#4F5563" font-weight="400" text-anchor="middle">rotate by g = f · e^(−η(U−T))</text><rect x="770" y="225" width="100" height="30" rx="6" fill="#E0F0EE" stroke="#00897B" stroke-width="1.2"/><text x="820" y="245" font-size="10" fill="#00897B" font-weight="700" text-anchor="middle">IQAE / MLAE</text><text x="20" y="290" font-size="10.5" fill="#4F5563" font-weight="400" text-anchor="start">O(n + |E|) qubits and gates for any dependence graph; exact (no truncation); bounded weights keep the amplitude at a = μ·e^(I(T)).</text><g transform="translate(830,30) scale(0.38)">
