<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" width="1180" height="300" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><rect x="30" y="90" width="190" height="110" rx="14" fill="#DCE8F5" stroke="#1F3557" stroke-width="1.8"/><text x="125" y="130" font-size="17" fill="#1F3557" font-weight="700" text-anchor="middle">Event loss table</text><text x="125" y="158" font-size="12.5" fill="#4F5563" font-weight="400" text-anchor="middle">event · rate · loss per country</text><polyline points="222,145 256,145" fill="none" stroke="#1F3557" stroke-width="2.4" stroke-linejoin="round"/><polygon points="256,145 249.7,148.0 249.7,142.0" fill="#1F3557"/><rect x="260" y="90" width="190" height="110" rx="14" fill="#DCE8F5" stroke="#1F3557" stroke-width="1.8"/><text x="355" y="130" font-size="17" fill="#1F3557" font-weight="700" text-anchor="middle">Payouts</text><text x="355" y="158" font-size="12.5" fill="#4F5563" font-weight="400" text-anchor="middle">loss → quarter steps,</text><text x="355" y="176" font-size="12.5" fill="#4F5563" font-weight="400" text-anchor="middle">rain trigger</text><polyline points="452,145 486,145" fill="none" stroke="#1F3557" stroke-width="2.4" stroke-linejoin="round"/><polygon points="486,145 479.7,148.0 479.7,142.0" fill="#1F3557"/><rect x="490" y="90" width="190" height="110" rx="14" fill="#DCE8F5" stroke="#1F3557" stroke-width="1.8"/><text x="585" y="130" font-size="17" fill="#1F3557" font-weight="700" text-anchor="middle">Footprints</text><text x="585" y="158" font-size="12.5" fill="#4F5563" font-weight="400" text-anchor="middle">events grouped by the set</text><text x="585" y="176" font-size="12.5" fill="#4F5563" font-weight="400" text-anchor="middle">of countries they pay in</text><polyline points="682,145 716,145" fill="none" stroke="#1F3557" stroke-width="2.4" stroke-linejoin="round"/><polygon points="716,145 709.7,148.0 709.7,142.0" fill="#1F3557"/><rect x="720" y="90" width="190" height="110" rx="14" fill="#F3E7CF" stroke="#1F3557" stroke-width="1.8"/><text x="815" y="130" font-size="17" fill="#1F3557" font-weight="700" text-anchor="middle">Poisson sources</text><text x="815" y="158" font-size="12.5" fill="#4F5563" font-weight="400" text-anchor="middle">exact capped 3-year law</text><text x="815" y="176" font-size="12.5" fill="#4F5563" font-weight="400" text-anchor="middle">per footprint (Prop. 1)</text><polyline points="912,145 946,145" fill="none" stroke="#1F3557" stroke-width="2.4" stroke-linejoin="round"/><polygon points="946,145 939.7,148.0 939.7,142.0" fill="#1F3557"/><rect x="950" y="90" width="190" height="110" rx="14" fill="#24426A" stroke="#1F3557" stroke-width="1.8"/><text x="1045" y="130" font-size="17" fill="#F6F1E7" font-weight="700" text-anchor="middle">RDPO / exact</text><text x="1045" y="158" font-size="12.5" fill="#C9DBEF" font-weight="400" text-anchor="middle">estimates ± CI,</text><text x="1045" y="176" font-size="12.5" fill="#C9DBEF" font-weight="400" text-anchor="middle">stress tests, pair exact</text><text x="30" y="50" font-size="20" fill="#1F3557" font-weight="700" text-anchor="start">Catastrophe-model output in, joint-tail answers out</text><text x="30" y="250" font-size="13" fill="#4F5563" font-weight="400" text-anchor="start">Also accepts a year loss table: event rates = occurrences / simulated years.</text><g transform="translate(1110,92) scale(0.9)">
