<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 432" width="1180" height="432" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><text x="30" y="40" font-size="22" fill="#1F3557" font-weight="700" text-anchor="start">What the data say about the bond's two dependence assumptions</text><text x="30" y="128" font-size="17" fill="#1E2430" font-weight="700" text-anchor="start">Earthquakes hitting both countries</text><text x="30" y="150" font-size="12.5" fill="#4F5563" font-weight="400" text-anchor="start">share of events · NOAA loss records 1900–2020</text><line x1="400" y1="120" x2="960" y2="120" stroke="#DDD4C4" stroke-width="10" stroke-linecap="round"/><text x="400" y="154" font-size="11.5" fill="#8A8E98" font-weight="400" text-anchor="middle">0%</text><text x="540.0" y="154" font-size="11.5" fill="#8A8E98" font-weight="400" text-anchor="middle">25%</text><text x="680.0" y="154" font-size="11.5" fill="#8A8E98" font-weight="400" text-anchor="middle">50%</text><text x="820.0" y="154" font-size="11.5" fill="#8A8E98" font-weight="400" text-anchor="middle">75%</text><text x="960.0" y="154" font-size="11.5" fill="#8A8E98" font-weight="400" text-anchor="middle">100%</text><line x1="469.61609746664226" y1="120" x2="843.270850131588" y2="120" stroke="#C8553A" stroke-width="10" stroke-linecap="round" opacity="0.35"/><circle cx="441.72" cy="120" r="11" fill="#F6F1E7" stroke="#4F5563" stroke-width="3"/><text x="441.72" y="102" font-size="12.5" fill="#4F5563" font-weight="600" text-anchor="middle">brief 7.4%</text><circle cx="667.2222451964367" cy="120" r="12" fill="#C8553A"/><text x="667.2222451964367" y="102" font-size="13.5" fill="#C8553A" font-weight="700" text-anchor="middle">data 48%</text><text x="990" y="126" font-size="14" fill="#C8553A" font-weight="700" text-anchor="start">much higher</text><text x="30" y="238" font-size="17" fill="#1E2430" font-weight="700" text-anchor="start">Extreme rain hitting both countries</text><text x="30" y="260" font-size="12.5" fill="#4F5563" font-weight="400" text-anchor="start">share of events · 48 weather stations (GHCN-Daily)</text><line x1="400" y1="230" x2="960" y2="230" stroke="#DDD4C4" stroke-width="10" stroke-linecap="round"/><text x="400" y="264" font-size="11.5" fill="#8A8E98" font-weight="400" text-anchor="middle">0%</text><text x="540.0" y="264" font-size="11.5" fill="#8A8E98" font-weight="400" text-anchor="middle">25%</text><text x="680.0" y="264" font-size="11.5" fill="#8A8E98" font-weight="400" text-anchor="middle">50%</text><text x="820.0" y="264" font-size="11.5" fill="#8A8E98" font-weight="400" text-anchor="middle">75%</text><text x="960.0" y="264" font-size="11.5" fill="#8A8E98" font-weight="400" text-anchor="middle">100%</text><line x1="403.42457572512365" y1="230" x2="443.37019333252243" y2="230" stroke="#00897B" stroke-width="10" stroke-linecap="round" opacity="0.35"/><circle cx="540.0" cy="230" r="11" fill="#F6F1E7" stroke="#4F5563" stroke-width="3"/><text x="540.0" y="212" font-size="12.5" fill="#4F5563" font-weight="600" text-anchor="middle">brief 25.0%</text><circle cx="412.44444444444446" cy="230" r="12" fill="#00897B"/><text x="412.44444444444446" y="212" font-size="13.5" fill="#00897B" font-weight="700" text-anchor="middle">data 2%</text><text x="990" y="236" font-size="14" fill="#00897B" font-weight="700" text-anchor="start">much lower</text><rect x="30" y="300" width="860" height="110" rx="14" fill="#FBF8F1" stroke="#DDD4C4" stroke-width="1.5"/><text x="52" y="330" font-size="15" fill="#1E2430" font-weight="600" text-anchor="start">Chance that the pool pays more than US$80m in a three-year term</text><text x="52" y="368" font-size="30" fill="#4F5563" font-weight="700" text-anchor="start">1.2%</text><text x="150" y="364" font-size="28" fill="#4F5563" font-weight="400" text-anchor="start">→</text><text x="192" y="368" font-size="34" fill="#C8553A" font-weight="700" text-anchor="start">3.8%</text><text x="310" y="360" font-size="18" fill="#C8553A" font-weight="700" text-anchor="start">3.1× the brief (posterior median)</text><text x="310" y="380" font-size="13" fill="#C8553A" font-weight="600" text-anchor="start">95% credible interval 2.1%–5.3%</text><text x="52" y="402" font-size="12.5" fill="#1E2430" font-weight="600" text-anchor="start">A shared US$80m limit for both countries would pay 97% of expected payouts under the brief, 91% under the data.</text><text x="52" y="418" font-size="11" fill="#8A8E98" font-weight="400" text-anchor="start">Indicative: public data as proxies for payout triggers; not a re-pricing of the actual bond.</text><g transform="translate(1010,400) scale(1.05,1.05)">
