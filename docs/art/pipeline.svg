<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><rect x="20" y="40" width="196" height="140" rx="12" fill="#FBF8F1" stroke="#AD7A00" stroke-width="2"/><rect x="20" y="40" width="196" height="34" rx="12" fill="#AD7A00"/><rect x="20" y="60" width="196" height="14" fill="#AD7A00"/><text x="118" y="62" font-size="13" fill="#F6F1E7" font-weight="700" text-anchor="middle">0  Warm start</text><text x="118" y="102" font-size="11" fill="#1E2430" font-weight="400" text-anchor="middle">optimal exponential twist</text><text x="118" y="122" font-size="11" fill="#1E2430" font-weight="400" text-anchor="middle">(large-deviation Doob</text><text x="118" y="142" font-size="11" fill="#1E2430" font-weight="400" text-anchor="middle">transform of the loss)</text><line x1="218" y1="110" x2="240" y2="110" stroke="#4F5563" stroke-width="2"/><polygon points="240,110 233.6,112.7 233.6,107.3" fill="#4F5563"/><rect x="242" y="40" width="196" height="140" rx="12" fill="#FBF8F1" stroke="#2F6AB0" stroke-width="2"/><rect x="242" y="40" width="196" height="34" rx="12" fill="#2F6AB0"/><rect x="242" y="60" width="196" height="14" fill="#2F6AB0"/><text x="340" y="62" font-size="13" fill="#F6F1E7" font-weight="700" text-anchor="middle">1  Cross-entropy</text><text x="340" y="102" font-size="11" fill="#1E2430" font-weight="400" text-anchor="middle">multilevel policy search</text><text x="340" y="122" font-size="11" fill="#1E2430" font-weight="400" text-anchor="middle">minimises KL(p* ‖ q)</text><text x="340" y="142" font-size="11" fill="#1E2430" font-weight="400" text-anchor="middle">convex updates</text><line x1="440" y1="110" x2="462" y2="110" stroke="#4F5563" stroke-width="2"/><polygon points="462,110 455.6,112.7 455.6,107.3" fill="#4F5563"/><rect x="464" y="40" width="196" height="140" rx="12" fill="#FBF8F1" stroke="#C8553A" stroke-width="2"/><rect x="464" y="40" width="196" height="34" rx="12" fill="#C8553A"/><rect x="464" y="60" width="196" height="14" fill="#C8553A"/><text x="562" y="62" font-size="13" fill="#F6F1E7" font-weight="700" text-anchor="middle">2  Rényi-2 gradient</text><text x="562" y="102" font-size="11" fill="#1E2430" font-weight="400" text-anchor="middle">REINFORCE on log E[(wf)²]</text><text x="562" y="122" font-size="11" fill="#1E2430" font-weight="400" text-anchor="middle">minimises χ²(p* ‖ q)</text><text x="562" y="142" font-size="11" fill="#1E2430" font-weight="400" text-anchor="middle">early-stopped</text><line x1="662" y1="110" x2="684" y2="110" stroke="#4F5563" stroke-width="2"/><polygon points="684,110 677.6,112.7 677.6,107.3" fill="#4F5563"/><rect x="686" y="40" width="196" height="140" rx="12" fill="#FBF8F1" stroke="#00897B" stroke-width="2"/><rect x="686" y="40" width="196" height="34" rx="12" fill="#00897B"/><rect x="686" y="60" width="196" height="14" fill="#00897B"/><text x="784" y="62" font-size="13" fill="#F6F1E7" font-weight="700" text-anchor="middle">3  Estimation</text><text x="784" y="102" font-size="11" fill="#1E2430" font-weight="400" text-anchor="middle">selected policy + RQMC</text><text x="784" y="122" font-size="11" fill="#1E2430" font-weight="400" text-anchor="middle">all eligible batches recycled</text><text x="784" y="142" font-size="11" fill="#1E2430" font-weight="400" text-anchor="middle">unbiased, with CI</text><text x="20" y="24" font-size="13" fill="#1F3557" font-weight="700" text-anchor="start">RDPO: one fixed path budget B covers training and estimation</text><rect x="20.0" y="206" width="51.7" height="20" fill="#AD7A00" opacity="0.85"/><rect x="71.7" y="206" width="172.4" height="20" fill="#2F6AB0" opacity="0.85"/><text x="157.92000000000002" y="220" font-size="10" fill="#F6F1E7" font-weight="700" text-anchor="middle">CE</text><rect x="244.1" y="206" width="206.9" height="20" fill="#C8553A" opacity="0.85"/><text x="347.56" y="220" font-size="10" fill="#F6F1E7" font-weight="700" text-anchor="middle">χ² stage</text><rect x="451.0" y="206" width="431.0" height="20" fill="#00897B" opacity="0.85"/><text x="666.5" y="220" font-size="10" fill="#F6F1E7" font-weight="700" text-anchor="middle">estimation</text><text x="20" y="248" font-size="10.5" fill="#4F5563" font-weight="400" text-anchor="start">budget B (illustrative split); every batch drawn by an already level-reaching policy also enters the final estimate</text></svg>